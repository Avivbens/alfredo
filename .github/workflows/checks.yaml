---
name: PR Health Checks 🐛
on: pull_request

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  PR-checks:
    runs-on: ubuntu-latest
    name: PR Health Checks 🐛
    steps:
      - name: 📀 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🖥️ Setup Env
        uses: ./.github/workflows/install

      - name: 🧪 Check out repository code
        uses: ./.github/workflows/health-check
        with:
          run-tests: true
          run-tests-command: 'pnpm exec nx affected --target=test --parallel'
          run-lint: true
          run-lint-command: 'pnpm exec nx affected --target=lint --parallel'
          run-build: true
          run-build-command: 'pnpm exec nx affected --target=build --parallel'
          run-typecheck: true
          run-typecheck-command: 'pnpm exec nx affected --target=typecheck --parallel'
