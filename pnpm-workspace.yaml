packages:
  - projects/e2e/**
  - projects/libs/**
  - projects/packages/**
  - projects/workspace

allowBuilds:
  '@nestjs/core': false
  '@swc/core': true
  esbuild: true
  node-mac-contacts: false # engage-contact ships its own prebuilt `contacts.node`
  nx: true

minimumReleaseAgeExclude:
  - fast-alfred # owned by the same owner

overrides:
  '@xmldom/xmldom@>=0.9.0-beta.1 <=0.9.11': ^0.9.12
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  brace-expansion@>=3.0.0 <5.0.7: ^5.0.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  browserslist@<=4.28.6: ^4.28.7
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  minimatch@<11.0.1: ^11.0.1
  # Nx calls `minimatch.makeRe`, which 11.x removed, so it keeps its pinned 10.2.5 - it only matches the repo's own globs.
  nx>minimatch: 10.2.5
  '@nx/devkit>minimatch': 10.2.5
  undici@>=7.0.0 <7.30.1: ^7.30.1
